<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ember</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --panel: #0a0604;
    --panel-2: #120a05;
    --line: #2a1608;
    --line-hi: #4a2509;
    --accent: #e8730c;
    --accent-dim: #8a4507;
    --text: #e9dccf;
    --muted: #8d7a69;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Quicksand", system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; }
  #app { display: flex; flex-direction: column; height: 100dvh; }

  /* ---------- tab strip ---------- */
  #tabs { display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px 0;
    border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab { display: flex; align-items: center; gap: 8px; min-width: 120px; max-width: 200px;
    height: 36px; padding: 0 8px 0 14px; border: 1px solid var(--line); border-bottom: none;
    border-radius: 10px 10px 0 0; background: var(--panel); color: var(--muted); cursor: pointer;
    flex: none; font-size: 14px; font-weight: 600; }
  .tab.active { color: var(--accent); border-color: var(--accent-dim); background: #140702; }
  .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { border: 0; background: none; width: 22px; height: 22px; border-radius: 6px;
    cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; }
  .tab .x:hover { background: var(--line); color: var(--text); }
  #newtab { flex: none; width: 36px; height: 32px; margin-bottom: 4px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--muted); font-size: 20px; }
  #newtab:hover { color: var(--accent); border-color: var(--accent-dim); }

  /* ---------- toolbar ---------- */
  #bar { display: flex; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .ib { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--text); }
  .ib:hover { border-color: var(--accent-dim); color: var(--accent); }
  .ib svg { width: 18px; height: 18px; }
  #url { flex: 1; min-width: 0; height: 40px; padding: 0 16px; border-radius: 12px;
    border: 1px solid var(--line-hi); background: #0d0703; color: var(--text); font: inherit; font-size: 15px; outline: none; }
  #url:focus { border-color: var(--accent); }
  #url::placeholder, #home-search::placeholder { color: #6b5848; }

  /* ---------- content ---------- */
  #view { position: relative; flex: 1; min-height: 0; }
  #view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
  #view iframe.active { display: block; }
  #loading { position: absolute; top: 0; left: 0; height: 2px; width: 0; background: var(--accent);
    transition: width .4s ease, opacity .3s; z-index: 5; opacity: 0; }
  #loading.on { opacity: 1; width: 70%; transition: width 6s cubic-bezier(.1,.6,.3,1); }

  #home { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 16px 15vh; overflow: hidden; }
  #home.active { display: flex; }
  #home::before { content: ""; position: absolute; width: 520px; height: 520px; left: -220px; bottom: -200px;
    background: radial-gradient(circle, rgba(232,115,12,.10), transparent 65%); pointer-events: none; }
  #home h1 { font-weight: 500; font-size: clamp(36px, 8vw, 54px); letter-spacing: .35em; margin: 0 0 40px .35em;
    color: var(--accent); text-shadow: 0 0 30px rgba(232,115,12,.25); }
  .search { position: relative; width: min(640px, 100%); }
  .search svg { position: absolute; left: 20px; top: 50%; translate: 0 -50%; width: 20px; height: 20px; color: var(--accent); }
  #home-search { width: 100%; height: 60px; padding: 0 20px 0 54px; border-radius: 14px; border: 1px solid var(--line-hi);
    background: #080402; color: var(--text); font: inherit; font-size: 17px; outline: none; }
  #home-search:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(232,115,12,.12); }
  #quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 22px; margin-top: 44px; width: min(640px, 100%); }
  .q { display: flex; flex-direction: column; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer;
    color: var(--muted); font-size: 15px; font-weight: 600; letter-spacing: .03em; width: 76px; }
  .q span.ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 22px;
    font-weight: 700; color: #000; background: #b9a796; transition: transform .15s, background .15s; }
  .q:hover span.ic { background: var(--accent); transform: translateY(-2px); }
  .q:hover { color: var(--text); }
  #status { margin-top: 32px; font-size: 13px; color: var(--muted); min-height: 1em; text-align: center; }
  #status.err { color: #ff7a5c; }

  /* ---------- settings ---------- */
  #settings-btn { position: absolute; left: 20px; bottom: 20px; width: 50px; height: 50px; border-radius: 14px;
    border: 1px solid var(--accent-dim); background: #140702; color: var(--accent); cursor: pointer; display: grid; place-items: center;
    box-shadow: 0 0 18px rgba(232,115,12,.2); }
  #settings-btn svg { width: 22px; height: 22px; }
  dialog { background: var(--panel-2); color: var(--text); border: 1px solid var(--line-hi); border-radius: 16px;
    padding: 22px; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  dialog h2 { margin: 0 0 16px; font-size: 20px; color: var(--accent); font-weight: 600; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  dialog input, dialog select { width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-hi);
    background: #080402; color: var(--text); font: inherit; outline: none; }
  dialog input:focus, dialog select:focus { border-color: var(--accent); }
  dialog p.hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  dialog .btn { height: 38px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line-hi); background: var(--panel); cursor: pointer; }
  dialog .btn.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

  @media (max-width: 560px) {
    #bar { gap: 6px; padding: 8px; }
    .ib { width: 36px; height: 36px; border-radius: 10px; }
    #url { height: 36px; padding: 0 12px; font-size: 14px; }
    .hide-sm { display: none; }
    .q { width: 64px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="tabs"><button id="newtab" title="New tab" aria-label="New tab">+</button></div>

  <div id="bar">
    <button class="ib" id="back" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="ib" id="fwd" title="Forward" aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="ib" id="reload" title="Reload" aria-label="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="ib" id="home-btn" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
    <input id="url" type="text" placeholder="Search or enter URL" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
    <button class="ib" id="full" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div id="view">
    <div id="loading"></div>
    <div id="home">
      <h1>ember</h1>
      <form class="search" id="home-form">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="home-search" type="text" placeholder="Search or enter URL..." autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      </form>
      <div id="quick"></div>
      <div id="status"></div>
      <button id="settings-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></svg></button>
    </div>
  </div>
</div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>Settings</h2>
    <label for="s-wisp">Wisp server</label>
    <input id="s-wisp" type="text" spellcheck="false">
    <p class="hint">The relay that actually fetches pages for you. If sites won't load, try another public Wisp server or host your own.</p>
    <label for="s-engine">Search engine</label>
    <select id="s-engine">
      <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
      <option value="https://www.google.com/search?q=%s">Google</option>
      <option value="https://www.bing.com/search?q=%s">Bing</option>
      <option value="https://search.brave.com/search?q=%s">Brave</option>
    </select>
    <div class="row">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<script src="uv/uv.bundle.js"></script>
<script src="uv/uv.config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
