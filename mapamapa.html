<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mapamapa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&family=Pixelify+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen game — HUD strip on top, cozy scene on the left, notebook-style side panel on the right (stacks on phones). */
:root{
  --cocoa:#2f2227;      /* app backdrop */
  --cocoa2:#3d2c32;
  --ink:#4a3238;        /* outlines + text */
  --ink2:#7b6168;
  --oat:#fff8ef;        /* panels */
  --oat2:#f7ebdc;
  --oat3:#efdcc6;
  --mint:#5fbf9b;
  --mint-d:#3c977a;
  --berry:#ef7d93;
  --berry-d:#cf5a72;
  --honey:#f3b555;
  --honey-d:#d48f2a;
  --sky:#8cc4ea;
  --lav:#b7a3e3;
  --bad:#e0605e;
  --display:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  --pixel:'Pixelify Sans','Courier New',ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--cocoa);
  background-image:radial-gradient(circle at 20% 10%,#4a3540 0,transparent 45%),radial-gradient(circle at 90% 90%,#3a2a40 0,transparent 40%);
  color:var(--ink);font-family:var(--body);font-weight:600;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
button{font-family:var(--body);font-weight:800;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0}

/* HUD */
#hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{background:var(--oat);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--display);font-weight:600;font-size:17px}
.pill small{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
#hudName{font-family:var(--display);font-size:19px;font-weight:700;color:var(--oat);padding:0 4px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{display:inline-flex;gap:1px;position:relative}
.stars i{width:17px;height:17px;display:block;position:relative}
.stars i::before,.stars i::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.stars i::before{background:#e3d3c2}
.stars i::after{background:var(--honey);width:var(--f,0%)}
.cleanbar{width:64px;height:9px;border-radius:9px;background:var(--oat3);overflow:hidden;border:1.5px solid var(--ink)}
.cleanbar span{display:block;height:100%;background:var(--mint);transition:width .4s}
.hud-btn{border:2.5px solid var(--ink);border-radius:14px;padding:7px 14px;box-shadow:0 3px 0 var(--ink);font-size:14px;background:var(--oat);transition:transform .08s}
.hud-btn.speed{display:flex;align-items:center;gap:4px;padding:6px 10px;min-width:70px;justify-content:center;font-variant-numeric:tabular-nums}.hud-btn.speed svg{width:16px;height:16px}.hud-btn.speed b{font-family:var(--display);font-weight:600;font-size:16px}.hud-btn.speed.fast{background:#dff4ea}.hud-btn.speed.slow{background:#e6eef8}
.hud-btn.ico{padding:6px 8px;line-height:0}.hud-btn.ico svg{width:20px;height:20px}
.hud-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hud-btn.go{background:var(--mint);color:#fff;text-shadow:0 1px 0 var(--mint-d)}
.hud-btn.stop{background:var(--berry);color:#fff;text-shadow:0 1px 0 var(--berry-d)}
.hud-btn.on{background:var(--honey)}
.spacer{flex:1}
.hud-right{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:flex-end;margin-left:auto}
#hud{gap:6px}
.pill{padding:4px 9px;gap:6px}
.pill b{font-size:16px}
.cleanbar{width:50px}
.hud-btn{padding:6px 11px}
.hud-right{gap:6px}

/* main */
#main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;min-height:0}
#sceneWrap{position:relative;min-height:0;min-width:0;border-radius:22px;background:#1f171b;border:3px solid var(--ink);box-shadow:inset 0 0 0 3px #4a3a40;display:flex;align-items:center;justify-content:center;overflow:hidden}
#sceneWrap canvas{display:block;image-rendering:auto;touch-action:manipulation}
#glc{border-radius:10px}
#floorTabs{position:absolute;left:12px;top:12px;display:flex;gap:6px;z-index:3}
#floorTabs button{border:2.5px solid var(--ink);border-radius:11px;background:var(--oat);padding:4px 11px;font-family:var(--display);font-weight:600;box-shadow:0 2px 0 var(--ink)}
#floorTabs button.on{background:var(--honey)}
#sceneHint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(47,34,39,.85);color:var(--oat);padding:6px 14px;border-radius:999px;font-size:13px;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#sceneHint.alert{background:var(--bad);font-weight:800;font-size:14px;border:2.5px solid var(--ink);animation:pulse2 .8s infinite alternate}
@keyframes pulse2{to{background:#b8343c}}
.pill.rush{background:#fff0c9;animation:rushp .7s infinite alternate}
@keyframes rushp{to{background:#ffd98a}}
.firebox{display:grid;grid-template-columns:80px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:6px}
.firebox canvas{width:80px;height:80px;background:var(--oat2);border-radius:16px;border:2.5px solid var(--ink)}
.firelist{margin:10px 0 14px;padding-left:20px;line-height:1.55;font-size:14px}
.cafename{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.cafename h2{margin:0!important;text-align:center;overflow-wrap:anywhere}
.cafename .btn{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;font-size:12px}
#coachRing.nudge{animation:ringnudge .5s}
@keyframes ringnudge{0%,100%{transform:scale(1)}30%{transform:scale(1.08);border-color:#fff}60%{transform:scale(.97)}}
.say-box.nudge{animation:boxnudge .4s}
@keyframes boxnudge{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.rushline{background:var(--oat2);border:2px dashed var(--oat3);border-radius:12px;padding:7px 11px;font-size:12.5px;margin:0 0 10px;color:var(--ink2)}
.rushline b{color:var(--ink)}
.rushline.on{background:#fff0c9;border:2px solid var(--honey-d);color:var(--ink)}
#toastBox{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:4;pointer-events:none;max-width:70%}
.toast{background:var(--oat);border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;font-size:13px;box-shadow:0 3px 0 var(--ink);animation:tin .25s ease-out}
.toast.good{background:#dff4ea}.toast.bad{background:#fde0e3}.toast.gold{background:#fff0c9}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* panel */
#panel{background:var(--oat);border:3px solid var(--ink);border-radius:22px;display:flex;flex-direction:column;min-height:0;box-shadow:0 5px 0 var(--ink);overflow:hidden}
#tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:3px solid var(--ink);background:var(--oat2)}
#tabs button{border:0;background:none;padding:9px 2px 7px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border-right:2px dashed var(--oat3)}
#tabs button:last-child{border-right:0}
#tabs button.on{background:var(--oat)}
#tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--berry)}
#tabs svg{width:20px;height:20px}
#tabs .badge{position:absolute;top:4px;right:8px;background:var(--berry);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;border:1.5px solid var(--ink)}
#pbody{flex:1;overflow-y:auto;padding:14px;min-height:0;overscroll-behavior:contain}
#pbody h2{font-family:var(--display);font-weight:600;font-size:21px;margin:0 0 4px;text-wrap:balance}
#pbody h3{font-family:var(--display);font-weight:600;font-size:16px;margin:14px 0 8px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 10px;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.seg button{border:2px solid var(--ink);background:var(--oat);border-radius:999px;padding:4px 10px;font-size:12px}
.seg button.on{background:var(--ink);color:var(--oat)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{background:#fff;border:2.5px solid var(--ink);border-radius:15px;padding:9px;display:flex;flex-direction:column;gap:5px;position:relative;min-width:0}
.card .ic{width:100%;aspect-ratio:1.5;max-width:100%;border-radius:10px;background:var(--oat2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ic img{width:72%;height:auto;max-height:100%;object-fit:contain}
.card .nm{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.15}
.card .ds{font-size:11.5px;color:var(--ink2);line-height:1.3;min-height:15px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.price{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.btn{border:2.5px solid var(--ink);border-radius:11px;padding:5px 11px;background:var(--mint);color:#fff;box-shadow:0 2px 0 var(--ink);font-size:13px;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.alt{background:var(--oat);color:var(--ink);text-shadow:none}
.btn.pink{background:var(--berry)}
.btn.gold{background:var(--honey)}
.btn:disabled{background:#d9cfc6;color:#8d7c80;cursor:not-allowed;text-shadow:none}
.btn.wide{width:100%;padding:9px}
.lock{position:absolute;inset:0;background:rgba(255,248,239,.72);border-radius:13px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);text-align:center;padding:8px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:7px;padding:1px 6px;background:var(--oat2);border:1.5px solid var(--ink);white-space:nowrap}
.tag.ok{background:#d8f2e6}.tag.no{background:#fde0e3}.tag.star{background:#fff0c9}
.owned{position:absolute;top:6px;right:6px;background:var(--ink);color:var(--oat);border-radius:8px;font-size:11px;padding:1px 7px}

/* orders */
.order{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:2.5px solid var(--ink);border-radius:15px;padding:8px;margin-bottom:8px}
.order img{width:52px;height:52px;background:var(--oat2);border-radius:11px}
.order .who{font-size:11.5px;color:var(--ink2);display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.order .what{font-family:var(--display);font-weight:600;font-size:15px}
.pbar{height:7px;border-radius:7px;background:var(--oat3);overflow:hidden;margin-top:4px}
.pbar span{display:block;height:100%;background:var(--mint)}
.order.vip{background:linear-gradient(135deg,#fff7dc,#fff)}
.empty{text-align:center;padding:26px 10px;color:var(--ink2)}
.empty svg{width:90px;height:90px;display:block;margin:0 auto 6px}
.log{font-size:12px;color:var(--ink2);border-top:2px dashed var(--oat3);margin-top:10px;padding-top:8px;display:flex;flex-direction:column;gap:3px}

/* menu list */
.mitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 4px;border-bottom:2px dashed var(--oat3)}
.mitem img{width:44px;height:44px;border-radius:9px;background:var(--oat2)}
.mitem.lk img{filter:grayscale(1) brightness(.8);opacity:.6}
.mitem .nm{font-family:var(--display);font-weight:600;font-size:14.5px}
.reqs{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}

/* review */
.bigstars{display:flex;justify-content:center;gap:4px;margin:6px 0}
.bigstars .stars i{width:34px;height:34px}
.factor{display:grid;grid-template-columns:96px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.factor .bar{height:11px;border-radius:9px;background:var(--oat3);overflow:hidden;border:1.5px solid var(--ink)}
.factor .bar span{display:block;height:100%}
.factor b{text-align:right;font-variant-numeric:tabular-nums}
.tip{font-size:12px;background:var(--oat2);border-radius:11px;padding:8px 10px;margin-top:4px;line-height:1.4}
.milestone{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:2px dashed var(--oat3);font-size:12.5px}
.milestone .n{font-family:var(--display);font-weight:700;font-size:16px;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--oat2)}
.milestone.got .n{background:var(--honey)}

/* staff */
.staff{display:grid;grid-template-columns:72px minmax(0,1fr);gap:11px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px;margin-bottom:10px}
.staff canvas{width:72px;height:72px;background:var(--oat2);border-radius:12px}
.lvl{display:flex;gap:3px;margin:4px 0}
.lvl i{width:14px;height:8px;border-radius:4px;background:var(--oat3);border:1.5px solid var(--ink)}
.lvl i.f{background:var(--berry)}
.kv{font-size:12px;color:var(--ink2);display:grid;grid-template-columns:auto 1fr;gap:1px 8px}
.kv b{color:var(--ink)}

textarea,input[type=text]{width:100%;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#fff;color:var(--ink);resize:vertical}
input[type=text]{font-family:var(--body);font-size:16px;font-weight:700}
.rowbtns{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(31,22,26,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--oat);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);max-width:520px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:20px}
.modal h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 6px;text-align:center;text-wrap:balance}
.modal p{line-height:1.45}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.sumgrid div{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--ink2)}
.sumgrid b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.rewards{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.rewards div{background:#fff;border:2px solid var(--ink);border-radius:11px;padding:7px 11px;font-size:13.5px}

/* title */
#title{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--cocoa);overflow:auto}
#titleCv{position:absolute;inset:0;width:100%;height:100%}
.tcard{position:relative;background:var(--oat);border:3px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);padding:24px 24px 20px;max-width:430px;width:100%;text-align:center}
.logo{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;color:var(--ink);margin:6px 0 2px;letter-spacing:-.01em}
.logo span{color:var(--berry)}
.tsub{color:var(--ink2);margin:6px 0 16px;font-size:14px}
.tcard .btn{font-size:16px;padding:10px}
.tcard .stack{display:flex;flex-direction:column;gap:9px}

/* minigame */
#mg .modal{max-width:760px;padding:16px}
.mgwrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.mgleft{background:linear-gradient(#f7e9d8,#efdcc6);border:2.5px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px;position:relative;overflow:hidden}
.mgleft canvas{width:220px;height:240px;max-width:100%}
.mgleft .on{font-family:var(--display);font-weight:600;font-size:16px;margin:2px 0 4px;text-align:center}
.dots{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.dots i{height:8px;flex:1;min-width:14px;border-radius:5px;background:var(--oat3);border:1.5px solid var(--ink)}
.dots i.d{background:var(--mint)}.dots i.c{background:var(--honey)}
.mgright h3{font-family:var(--display);font-size:22px;font-weight:600;margin:2px 0 4px}
.mgright .hint{color:var(--ink2);font-size:13.5px;margin:0 0 12px;line-height:1.4}
.meter{height:30px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;position:relative;overflow:hidden;margin:6px 0 12px}
.meter .band{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#c8efdc,#c8efdc 6px,#b3e6cd 6px,#b3e6cd 12px)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#a8714a,#6b3f27);transition:width .08s}
.meter .cur{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:var(--berry);border:2px solid var(--ink);border-radius:4px}
.meter .pz{position:absolute;top:0;bottom:0;background:rgba(243,181,85,.6)}
.bigact{font-family:var(--display);font-size:22px;font-weight:600;padding:14px 18px;border:3px solid var(--ink);border-radius:18px;background:var(--honey);box-shadow:0 4px 0 var(--ink);width:100%;user-select:none;-webkit-user-select:none;touch-action:none}
.bigact:active,.bigact.held{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.holdwrap{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;align-items:stretch}
.vgauge{height:170px;border:2.5px solid var(--ink);border-radius:16px;background:#fff;position:relative;overflow:hidden}
.vgauge .fill{position:absolute;left:0;right:0;bottom:0}
.vgauge .band{position:absolute;left:0;right:0;background:rgba(95,191,155,.35);border-top:2px dashed var(--mint-d);border-bottom:2px dashed var(--mint-d)}
.vgauge .tl{position:absolute;left:0;right:0;height:3px;background:var(--berry)}
.vgauge .lbl{position:absolute;left:0;right:0;top:4px;text-align:center;font-family:var(--display);font-weight:600;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{border:2.5px solid var(--ink);border-radius:13px;background:#fff;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;line-height:1.1}
.chip img{width:38px;height:38px}
.chip.ok{background:#d8f2e6}.chip.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.need{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:6px 10px;font-size:13px;margin-bottom:10px}
.res{text-align:center}
.res .q{font-family:var(--display);font-size:48px;font-weight:700;line-height:1}
.res .stars i{width:36px;height:36px}
.mgfoot{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.counter{font-family:var(--display);font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}

/* tutorial */
#coachRing{position:fixed;z-index:70;border:4px solid var(--honey);border-radius:16px;box-shadow:0 0 0 9999px rgba(31,22,26,.45);pointer-events:none;transition:all .25s;animation:pulse 1.2s infinite}
@keyframes pulse{50%{border-color:#fff}}
#coach{position:fixed;z-index:71;max-width:320px;background:var(--oat);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;font-size:14px;line-height:1.4}
#coach .ch{display:flex;gap:10px;align-items:flex-start}
#coach canvas{width:52px;height:52px;flex:none;background:var(--oat2);border-radius:12px}

/* dialogue box (Undertale style) */
#say{position:fixed;z-index:72;width:min(660px,calc(100vw - 32px));left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));font-family:var(--pixel);animation:sayin .18s steps(3)}
#say.top{bottom:auto;top:max(18px,env(safe-area-inset-top,0px))}
@keyframes sayin{from{transform:translateX(-50%) scale(.96);opacity:0}}
.say-name{display:inline-block;background:#000;color:#fff;border:4px solid #fff;border-bottom:0;padding:4px 12px 2px;margin-left:14px;font-size:15px;letter-spacing:.12em;position:relative;top:4px}

.say-text .ghost{visibility:hidden}
.say-next{position:absolute;right:14px;bottom:8px;font-size:13px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.say-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:15px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000}
.say-foot button{font-family:var(--pixel);background:#000;color:#fff;border:3px solid #fff;padding:3px 12px;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.say-foot button:hover,.say-foot button:focus-visible{color:#ffe04d;border-color:#ffe04d;outline:none}
#say.event .say-box{min-height:0}
#say.event .say-text{min-height:0}
@media (max-width:520px){.say-box{gap:12px;padding:12px 14px 14px 12px}.say-box canvas{width:60px;height:60px}.say-text{font-size:17px;min-height:60px}}

/* shop (Mapa Mart) */
#shop{z-index:55}
.shopModal{background:var(--oat);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);width:min(1100px,100%);height:min(800px,calc(100% - 6px));display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden;animation:shopin .22s cubic-bezier(.2,1.4,.5,1)}
@keyframes shopin{from{transform:translateY(16px) scale(.97);opacity:0}}
.awning{height:26px;background:repeating-linear-gradient(90deg,var(--berry) 0 34px,#fff8ef 34px 68px);position:relative;border-bottom:3px solid var(--ink);z-index:2}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:15px;margin-top:3px;background:radial-gradient(circle at 17px 0,var(--berry) 15px,transparent 16px) 0 0/68px 15px repeat-x,radial-gradient(circle at 51px 0,#fff8ef 15px,transparent 16px) 0 0/68px 15px repeat-x;filter:drop-shadow(0 3px 0 var(--ink))}

.shop-bubble{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 14px;position:relative;min-height:56px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.shop-bubble::before{content:"";position:absolute;left:-11px;top:22px;border:9px solid transparent;border-right-color:var(--ink);border-left:0}
.shop-bubble::after{content:"";position:absolute;left:-7px;top:24px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.shop-bubble b{font-family:var(--display);font-weight:600;font-size:12px;color:var(--berry-d);text-transform:uppercase;letter-spacing:.08em}
#shopSay{font-family:var(--pixel);font-size:17px;line-height:1.3;color:var(--ink)}
#shopSay .y{color:var(--honey-d)}#shopSay .r{color:var(--bad)}#shopSay .p{color:var(--berry-d)}#shopSay .g{color:var(--mint-d)}#shopSay .ghost{visibility:hidden}
.shop-wallet{background:var(--mint);color:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);text-align:right}
.shop-wallet small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.shop-wallet b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--mint-d)}
.shop-x{width:46px;height:46px;border-radius:14px;border:2.5px solid var(--ink);background:var(--oat);box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.shop-x:hover{background:var(--berry);color:#fff}
.shop-body{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.shop-nav{background:var(--oat2);border-right:2.5px solid var(--oat3);padding:12px 10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.shop-nav button{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:2.5px solid transparent;background:none;border-radius:14px;padding:5px 8px;font-size:14px}
.shop-nav button img{width:36px;height:36px;border-radius:10px;background:var(--tint);padding:2px}
.shop-nav button i{font-style:normal;background:var(--mint);color:#fff;font-size:11px;border-radius:9px;padding:1px 7px;border:1.5px solid var(--ink)}
.shop-nav button:hover{background:#fff8}
.shop-nav button.on{background:#fff;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.shop-main{overflow-y:auto;padding:0 18px 22px;min-width:0;overscroll-behavior:contain}
.shop-tools{position:sticky;top:0;z-index:3;background:var(--oat);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 10px}
.shop-tools input{flex:1;min-width:150px;max-width:320px;border:2.5px solid var(--ink);border-radius:999px;padding:7px 14px;font-family:var(--body);font-weight:700;font-size:14px;background:#fff;color:var(--ink)}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;background:#fff;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--oat)}
.shop-paused{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.shead{font-family:var(--display);font-weight:600;font-size:19px;margin:10px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.shead small{font-family:var(--body);font-size:12.5px;color:var(--ink2);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:14px;margin-bottom:12px}
.scard{background:#fff;border:2.5px solid var(--ink);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .14s,box-shadow .14s;box-shadow:0 3px 0 var(--ink)}
.scard:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--ink)}
.scard.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{30%{transform:scale(1.05) rotate(-1deg)}}
.sdisp{aspect-ratio:4/3;max-width:100%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 58%,#fff 0,#fff 22%,var(--tint) 72%);border-bottom:2.5px solid var(--ink);overflow:hidden}
.sdisp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:rgba(74,50,56,.07);border-top:2px solid rgba(74,50,56,.12)}
.sdisp img{width:64%;height:auto;max-height:86%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(74,50,56,.18));transition:transform .2s;position:relative;z-index:1}
.scard:hover .sdisp img{transform:scale(1.08) rotate(-4deg)}
.sticker{position:absolute;top:8px;right:8px;z-index:2;background:var(--honey);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-family:var(--display);font-weight:600;font-size:15px;transform:rotate(5deg);box-shadow:0 2px 0 var(--ink);font-variant-numeric:tabular-nums}
.sticker.ok{background:var(--mint);color:#fff}
.sticker.sell{background:var(--mint);color:#fff}
.scount{position:absolute;top:9px;left:9px;z-index:2;background:var(--ink);color:var(--oat);font-size:12px;border-radius:8px;padding:1px 8px}
.snew{position:absolute;bottom:10px;left:-24px;z-index:2;background:var(--berry);color:#fff;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;padding:2px 28px;transform:rotate(45deg) translate(0,0);transform-origin:center;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);top:14px;bottom:auto;left:-30px;transform:rotate(-38deg)}
.slock{position:absolute;inset:0;z-index:2;background:rgba(255,248,239,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-size:15px;letter-spacing:.05em}
.scard.locked{box-shadow:0 3px 0 var(--ink2)}
.scard.have .sdisp img{opacity:.85}
.sinfo{padding:9px 12px 4px;display:flex;flex-direction:column;gap:3px;flex:1}
.sinfo .nm{font-family:var(--display);font-weight:600;font-size:15.5px;line-height:1.15}
.sinfo .ds{font-size:12px;color:var(--ink2);line-height:1.35}
.unls{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.unl{display:inline-flex;align-items:center;gap:4px;background:#fff0c9;border:1.5px solid var(--ink);border-radius:8px;padding:1px 7px 1px 3px;font-size:11px;font-weight:800}
.unl img{width:18px;height:18px}
.unl.dim{background:var(--oat2);padding-left:7px}
.unl.warn{background:#fde0e3;padding-left:7px}
.sfoot{padding:6px 12px 12px}
.coinfly{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:22px;color:var(--berry-d);text-shadow:0 2px 0 #fff,0 0 4px #fff;pointer-events:none;animation:fly .9s ease-out forwards;z-index:4}
@keyframes fly{to{transform:translate(-50%,-70px);opacity:0}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:12px}
.bundle{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:linear-gradient(135deg,#fff7dc,#fff);border:2.5px solid var(--ink);border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--ink)}
.bimg{background:radial-gradient(circle,#fff 30%,#ffe3ea 75%);border:2px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center}
.bimg img{width:84px;height:auto}
.bbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--berry-d);font-weight:900}
.bbody .nm{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.1}
.bitems{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;font-weight:800}
.bitems span{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1.5px solid var(--ink);border-radius:9px;padding:1px 7px 1px 2px}
.bitems img{width:22px;height:22px}
.bitems b{color:var(--ink2)}
.sbanner{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;align-items:center;background:#3d2c32;color:var(--oat);border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;margin:4px 0 6px;font-size:13.5px;line-height:1.45}
.sbanner img{width:60px;height:60px;background:#f6dcdf;border-radius:12px}
@media (max-width:760px){
  .shop-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}

}

function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'}

/* ============ drawing helpers ============ */
function rr(c,x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else{r=Math.min(r,w/2,h/2);c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}}
function ell(c,x,y,rx,ry,rot=0){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,Math.PI*2)}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,Math.PI*2)}
function ol(c,w=2){c.lineWidth=w;c.strokeStyle=INK;c.lineJoin='round';c.lineCap='round'}
function fs(c,f){c.fillStyle=f;c.fill();c.stroke()}
function star5(c,x,y,r,ri){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?ri:r;c.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}c.closePath()}
function heart(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s*.9,y-s*.25,x-s*.35,y-s*.9,x,y-s*.35);c.bezierCurveTo(x+s*.35,y-s*.9,x+s*.9,y-s*.25,x,y+s*.35);c.closePath()}

/* ============ walls ============ */
function drawWallBase(c,style,W,H,cob){
  c.save();
  c.beginPath();c.rect(0,0,W,H);c.clip();
  switch(style){
    case 'rusty':{
      const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7d6656');g.addColorStop(1,'#5f4a3d');c.fillStyle=g;c.fillRect(0,0,W,H);
      for(let i=0;i<W/6;i++){const x=hash(i,1)*W,y=hash(i,2)*H,r=4+hash(i,3)*16;c.fillStyle=hash(i,4)>.5?'rgba(168,86,40,.45)':'rgba(70,48,34,.45)';ell(c,x,y,r,r*.7,hash(i,5)*3);c.fill()}
      c.strokeStyle='rgba(40,28,22,.55)';c.lineWidth=2;for(let x=0;x<W;x+=T*1.5){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();
        for(let y=10;y<H;y+=22){c.fillStyle='#4a3a30';circ(c,x+5,y,1.8);c.fill();c.fillStyle='rgba(150,80,35,.5)';c.fillRect(x+4,y+2,2,8+hash(x,y)*14)}}
      c.strokeStyle='rgba(30,20,16,.5)';c.lineWidth=1.2;for(let i=0;i<W/90;i++){let x=hash(i,9)*W,y=hash(i,8)*H*.6;c.beginPath();c.moveTo(x,y);for(let k=0;k<5;k++){x+=rnd(-6,6)*0+(hash(i,k)-.5)*12;y+=6+hash(k,i)*6;c.lineTo(x,y)}c.stroke()}
      break}
    case 'white':{c.fillStyle='#f3eee6';c.fillRect(0,0,W,H);for(let i=0;i<W;i++){c.fillStyle='rgba(180,160,140,.08)';c.fillRect(hash(i,1)*W,hash(i,2)*H,2,2)}break}
    case 'mint':{c.fillStyle='#c7ead9';c.fillRect(0,0,W,H);const y=H*.55;c.fillStyle='#93d0b8';c.fillRect(0,y,W,H-y);c.strokeStyle='rgba(60,151,122,.35)';c.lineWidth=1.5;for(let x=6;x<W;x+=12){c.beginPath();c.moveTo(x,y+4);c.lineTo(x,H);c.stroke()}c.fillStyle='#fff';c.fillRect(0,y-3,W,5);break}
    case 'peach':{c.fillStyle='#ffd6c4';c.fillRect(0,0,W,H);c.fillStyle='#ffe9df';for(let y=8,r=0;y<H;y+=16,r++)for(let x=(r%2)*12+6;x<W;x+=24){circ(c,x,y,3);c.fill()}break}
    case 'brick':{c.fillStyle='#e6d2c2';c.fillRect(0,0,W,H);const bw=26,bh=12;for(let y=0,r=0;y<H;y+=bh,r++)for(let x=-(r%2)*bw/2;x<W;x+=bw){const v=hash(x,y);c.fillStyle=v<.33?'#c9725a':v<.66?'#bd6650':'#d5826a';rr(c,x+1.5,y+1.5,bw-3,bh-3,2);c.fill()}break}
    case 'lavender':{for(let x=0,i=0;x<W;x+=16,i++){c.fillStyle=i%2?'#d2c3f0':'#e2d7f7';c.fillRect(x,0,16,H)}c.fillStyle='rgba(255,255,255,.5)';for(let x=8;x<W;x+=32){c.fillRect(x-1,0,2,H)}break}
    case 'wood':{for(let x=0,i=0;x<W;x+=20,i++){const v=hash(i,3);c.fillStyle=v<.33?'#b47c52':v<.66?'#a9714a':'#be875c';c.fillRect(x,0,20,H);c.strokeStyle='rgba(80,45,25,.35)';c.lineWidth=1;c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();c.strokeStyle='rgba(80,45,25,.15)';for(let k=0;k<3;k++){c.beginPath();c.moveTo(x+5+k*5,0);c.bezierCurveTo(x+3+k*5,H*.3,x+8+k*5,H*.6,x+5+k*5,H);c.stroke()}}break}
    case 'floral':{c.fillStyle='#fde7ec';c.fillRect(0,0,W,H);for(let y=10,r=0;y<H;y+=24,r++)for(let x=(r%2)*16+8;x<W;x+=32){c.fillStyle='#9ad0b6';ell(c,x+6,y+4,4,2,.6);c.fill();c.fillStyle=hash(x,y)>.5?'#f4a7ba':'#f7c2a0';for(let p=0;p<5;p++){const a=p*1.2566;circ(c,x+Math.cos(a)*3.4,y+Math.sin(a)*3.4,2.6);c.fill()}c.fillStyle='#f3b555';circ(c,x,y,1.8);c.fill()}break}
  }
  // crown + baseboard
  c.fillStyle=style==='rusty'?'#4a3a30':'rgba(255,255,255,.85)';c.fillRect(0,0,W,5);
  c.fillStyle='rgba(0,0,0,.08)';c.fillRect(0,5,W,3);
  c.fillStyle=style==='rusty'?'#3d2f27':'#fffaf3';c.fillRect(0,H-9,W,9);
  c.fillStyle='rgba(0,0,0,.12)';c.fillRect(0,H-9,W,2);
  if(cob){c.strokeStyle='rgba(235,235,235,.55)';c.lineWidth=1;for(const [cx,dir] of [[0,1],[W,-1]]){for(let k=1;k<5;k++){c.beginPath();c.arc(cx,0,k*9,dir>0?0:Math.PI/2,dir>0?Math.PI/2:Math.PI);c.stroke()}for(let a=0;a<5;a++){const ang=(dir>0?0:Math.PI/2)+a*Math.PI/8;c.beginPath();c.moveTo(cx,0);c.lineTo(cx+Math.cos(ang)*40,Math.sin(ang)*40);c.stroke()}}
    for(let i=0;i<3;i++){const x=W*(.3+i*.25);c.beginPath();c.moveTo(x-14,0);c.quadraticCurveTo(x,18,x+14,0);c.stroke()}}
  c.restore();
}
/* ============ floors ============ */
function drawFloorBase(c,style,W,H){
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
  switch(style){
    case 'rotten':{const ph=16;for(let y=0,r=0;y<H;y+=ph,r++){let x=-hash(r,1)*60;while(x<W){const L=50+hash(x,r)*70,v=hash(x,r,2);c.fillStyle=v<.3?'#6e523d':v<.6?'#7a5c44':'#5f4634';c.fillRect(x,y,L,ph);c.fillStyle='rgba(30,20,14,.6)';c.fillRect(x,y,1.5,ph);x+=L}c.fillStyle='rgba(25,16,12,.7)';c.fillRect(0,y+ph-2,W,2)}
      for(let i=0;i<W*H/2600;i++){const x=hash(i,11)*W,y=hash(i,12)*H;c.fillStyle='rgba(60,70,40,.35)';ell(c,x,y,8+hash(i,13)*14,5+hash(i,14)*6,0);c.fill()}
      for(let i=0;i<W*H/9000;i++){const x=hash(i,21)*W,y=hash(i,22)*H;c.fillStyle='#24180f';ell(c,x,y,5,3);c.fill()}
      break}
    case 'concrete':{c.fillStyle='#cdc8c1';c.fillRect(0,0,W,H);for(let i=0;i<W*H/40;i++){c.fillStyle=hash(i,3)>.5?'rgba(255,255,255,.25)':'rgba(90,80,70,.12)';c.fillRect(hash(i,1)*W,hash(i,2)*H,2,2)}c.strokeStyle='rgba(120,110,100,.25)';c.lineWidth=1;for(let x=0;x<W;x+=T*2){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=T*2){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}break}
    case 'oak':{const ph=12;for(let y=0,r=0;y<H;y+=ph,r++){let x=-hash(r,4)*80;while(x<W){const L=70+hash(x,r,7)*80,v=hash(x,r,3);c.fillStyle=v<.33?'#dcaa70':v<.66?'#d29d63':'#e3b57d';c.fillRect(x,y,L,ph);c.strokeStyle='rgba(150,95,50,.18)';c.lineWidth=1;c.beginPath();c.moveTo(x+4,y+ph*.5);c.bezierCurveTo(x+L*.3,y+ph*.2,x+L*.6,y+ph*.8,x+L-4,y+ph*.5);c.stroke();c.fillStyle='rgba(120,70,35,.35)';c.fillRect(x,y,1,ph);x+=L}c.fillStyle='rgba(120,70,35,.3)';c.fillRect(0,y+ph-1,W,1)}break}
    case 'checker':{const s=24;for(let y=0,r=0;y<H;y+=s,r++)for(let x=0,k=0;x<W;x+=s,k++){c.fillStyle=(r+k)%2?'#f3b8c2':'#fbf3e9';c.fillRect(x,y,s,s)}c.fillStyle='rgba(255,255,255,.18)';for(let y=0;y<H;y+=s)c.fillRect(0,y,W,2);break}
    case 'terracotta':{c.fillStyle='#efd8c4';c.fillRect(0,0,W,H);const s=24;for(let y=0;y<H;y+=s)for(let x=0;x<W;x+=s){const v=hash(x,y);c.fillStyle=v<.33?'#d98a5e':v<.66?'#cf7d52':'#e0966a';rr(c,x+1.5,y+1.5,s-3,s-3,3);c.fill();c.fillStyle='rgba(255,255,255,.12)';c.fillRect(x+3,y+3,s-8,3)}break}
    case 'herring':{c.fillStyle='#b98152';c.fillRect(0,0,W,H);const bw=8,bl=24;c.lineWidth=1;for(let col=0;col*bl<W+bl;col++){for(let y=-bl;y<H+bl;y+=bw*2){for(const d of [0,1]){c.save();const x=col*bl;c.translate(x+(d?bl/2:0),y+(d?bw:0));c.rotate(d?-Math.PI/4:Math.PI/4);const v=hash(col,y,d);c.fillStyle=v<.33?'#c48a5a':v<.66?'#b57d4e':'#cf9866';c.fillRect(0,0,bl,bw);c.strokeStyle='rgba(90,50,25,.35)';c.strokeRect(0,0,bl,bw);c.restore()}}}break}
    case 'marble':{c.fillStyle='#f4f1ed';c.fillRect(0,0,W,H);c.strokeStyle='rgba(150,140,150,.35)';c.lineWidth=1.2;for(let i=0;i<W*H/2500;i++){let x=hash(i,1)*W,y=hash(i,2)*H;c.beginPath();c.moveTo(x,y);c.bezierCurveTo(x+20,y+hash(i,3)*30,x+40,y-10,x+70,y+hash(i,4)*20);c.stroke()}c.strokeStyle='rgba(200,190,180,.4)';c.lineWidth=1;for(let x=0;x<W;x+=T){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=T){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}break}
  }
  const g=c.createLinearGradient(0,0,0,16);g.addColorStop(0,'rgba(40,25,30,.35)');g.addColorStop(1,'rgba(40,25,30,0)');c.fillStyle=g;c.fillRect(0,0,W,16);
  c.restore();
}

function drawEquip(c,id,x,y,o={}){
  c.save();c.translate(x,y);ol(c,2);const t=o.t||0;
  switch(id){

/* cup state building */
function newCupState(r){return{layers:[],dust:[],drizzle:[],slices:[],ice:0,hot:!['glass'].includes(r.cup)&&r.cat!=='Iced',dessert:r.cup==='plate'?{kind:r.dessert,stage:null}:null}}
function totalH(s){return s.layers.reduce((a,l)=>a+l.h,0)}
function applyFx(s,fx,r,extra){
  if(!fx)return;
  if(fx.add){let h=fx.h||.1;if(fx.hto!=null)h=Math.max(.04,(extra?.level??fx.hto)-totalH(s));s.layers.push({c:fx.add,h})}
  if(fx.mix){const h=extra?.level??fx.h;s.layers=[{c:fx.mix,h:Math.max(.06,h)}]}
  if(fx.foam)s.foam=true;
  if(fx.art)s.art=true;
  if(fx.ice)s.ice=extra?.count??fx.ice;
  if(fx.cream)s.cream=fx.cream;
  if(fx.smooth){s.smooth=true;s.ice=0}
  if(fx.batter&&s.dessert)s.dessert.stage='raw';
  if(fx.bake&&s.dessert){s.dessert.stage='baked';s.dessert.q=extra?.q??1}
}
function applyIngVis(s,ingId,r){
  const v=ING[ingId]?.vis;if(s.dessert){if(!s.dessert.stage)s.dessert.stage='bits';if(s.dessert.stage==='baked'&&(ingId==='whipped'||ingId==='strawberry'))s.dessert.stage='deco';return}
  if(!v)return;
  if(v.syrup)s.layers.push({c:v.syrup,h:.05});
  if(v.drizzle)s.drizzle.push(v.drizzle);
  if(v.dust)s.dust.push(v.dust);
  if(v.cream)s.cream=v.cream;
  if(v.teabag)s.teabag=true;
  if(v.slice)s.slices.push({c:v.slice,i:s.slices.length});
  if(v.sparkle)s.sparkle=true;
}
function finalCupState(r){const s=newCupState(r);for(const step of r.steps){if(step.t==='pick')step.need.forEach(i=>applyIngVis(s,i,r));else applyFx(s,step.fx,r)}if(s.dessert)s.dessert.stage=s.dessert.stage==='deco'?'deco':'final';return s}

  if(r.usesBeans&&!hasGrinder())m.push({t:'eq',id:'hammer',label:'Any grinder'});
  r.eq.forEach(e=>{if(!G.eq[e])m.push({t:'eq',id:e})});r.ing.forEach(i=>{if(!G.ing[i])m.push({t:'ing',id:i})});if(r.meat&&!G.meatEver)m.push({t:'meat',label:'Suspicious Meat'});return m;
}

function floorClean(fi){const f=G.floors[fi];let p=0;for(const d of f.dirt)p+=d.kind==='corpse'?24:d.kind==='blood'?5:d.kind==='grime'?7:d.kind==='trash'?4:d.kind==='spill'?5:4;if(WALLS[f.wall].dirty)p+=12;if(FLOORS[f.floor].dirty)p+=12;if(f.cob)p+=6;return clamp(100-p,0,100)}

  let tiles=0,beauty=0,seats=0,clean=0,style=0;
  G.floors.forEach((f,fi)=>{const n=f.w*f.h;tiles+=n;clean+=floorClean(fi)*n;style+=(WALLS[f.wall].beauty+FLOORS[f.floor].beauty)/12*n;
    for(const it of f.items){const d=FURN[it.id];beauty+=d.beauty;if(d.role==='seat'){let tb=false;for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]]){const o=itemAt(fi,it.c+dc,it.r+dr);if(o&&FURN[o.id].role==='table')tb=true}seats+=tb?1:.6}}

function serveOrder(o,q,byBarista){

  else{cu.carry=true;leave(cu,false)}

}

function findJanitorWork(j){
  const taken=new Set(Object.values(R.actors).filter(o=>o!==j&&o.kind==='janitor'&&(o.state==='walk'||o.state==='clean')&&o.target).map(o=>o.target));
  const order=[j.floor,...G.floors.map((_,i)=>i).filter(i=>i!==j.floor)];
  for(const fi of order){const f=G.floors[fi];const free=f.dirt.filter(d=>!taken.has(d));if(!free.length)continue;
    const targets=new Set(free.map(d=>d.c+','+d.r));
    const sc=Math.floor(j.x),sr=Math.floor(j.y);
    if(fi===j.floor){
      const path=bfs(fi,sc,sr,(c,r)=>{if(targets.has(c+','+r)&&isWalk(fi,c,r))return true;for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]])if(targets.has((c+dc)+','+(r+dr))&&!isWalk(fi,c+dc,r+dr))return true;return false});
      if(!path)continue;const end=path.length?path[path.length-1]:{c:sc,r:sr};
      let d=free.find(d=>d.c===end.c&&d.r===end.r)||free.find(d=>Math.abs(d.c-end.c)+Math.abs(d.r-end.r)===1&&!isWalk(fi,d.c,d.r));if(!d)continue;
      j.target=d;j.state='walk';j.legs=[{fi,cell:end}];j.path=path;j.cb=()=>{const s=staffById(j.sid);j.state='clean';j.timer=s?janitorCleanTime(s):2};return;
    }else{j.target=null;j.state='walk';goTo(j,fi,stairsCell(fi),()=>{j.state='idle'});return}
  }

  if(Math.random()<.3){const f=G.floors[j.floor];const c=rndi(0,f.w-1),r=rndi(0,f.h-1);if(isWalk(j.floor,c,r)){j.state='walk';goTo(j,j.floor,{c,r},()=>{j.state='idle'})}}
}

function toLogical(e){const r=glc.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*LW,y:(e.clientY-r.top)/r.height*LH}}

function sceneClick(e){
  if(!G||R.build)return;initAudio();const p=toLogical(e);const fi=R.view,f=G.floors[fi];
  const c=Math.floor(p.x/T),r=Math.floor((p.y-WALL*T)/T),onWall=p.y<WALL*T;
  if(R.edit){editClick(fi,f,c,r,onWall);return}
  if(R.rob&&fi===0){let br=null,bd=30;for(const rb of liveRobbers()){const x=rb.x*T,y=(WALL+rb.y+.32)*T-22;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;br=rb}}if(br){ownerAttack(br);return}}
  // dirt (nearest within reach)
  let best=null,bd=30;for(const d of f.dirt){const it=itemAt(fi,d.c,d.r);const dx=(d.c+.5)*T,dy=(WALL+d.r)*T+(it&&FURN[it.id].role!=='rug'?(FURN[it.id].role==='table'?16:26):T/2);const dist=Math.hypot(p.x-dx,p.y-dy);if(dist<bd){bd=dist;best=d}}
  if(best){scrub(fi,best);return}
  let cb=null,cd=34;for(const cu of R.custs){if(cu.floor!==fi||!cu.order||cu.order.status!=='waiting')continue;const x=cu.x*T,y=(WALL+cu.y+.32)*T-30;const dist=Math.hypot(p.x-x,p.y-y);if(dist<cd){cd=dist;cb=cu}}
  if(cb){openMinigame(cb.order);return}
  if(fi===0&&r>=0&&r<=1&&c<=4){const o=R.orders.find(o=>o.status==='waiting');if(o)openMinigame(o);else toast('No orders waiting right now.')}
}
function editClick(fi,f,c,r,onWall){
  const sel=R.sel&&FURN[R.sel];
  if(onWall){if(c<0||c>=f.w)return;if(fi===0&&c===f.w-1){toast('That is the front door.');return}const ex=f.wallItems.find(w=>w.c===c);
    if(sel&&sel.kind==='wall'){if(ex){toast('That wall spot is taken. Pick it up first.','bad');return}f.wallItems.push({id:R.sel,c});useInv(R.sel);sfx('pop');tutEvent('place');}
    else if(ex){f.wallItems=f.wallItems.filter(w=>w!==ex);G.inv[ex.id]=(G.inv[ex.id]||0)+1;sfx('pop')}
    R.amb=computeAmb();R.dirty=true;return}
  if(r<0||r>=f.h||c<0||c>=f.w)return;
  if(sel&&sel.kind==='floor'){
    if(!canPlace(fi,c,r)){toast(reserved(fi,c,r)?'This spot has to stay clear for customers.':'That spot is taken.','bad');return}
    const it={id:R.sel,c,r};f.items.push(it);rebuildOcc();
    if(!validateLayout(fi)){f.items.pop();rebuildOcc();toast('That would block the path for customers.','bad');return}
    useInv(R.sel);sfx('pop');addPart((c+.5)*T,(WALL+r+.5)*T,'sparkle');repathAll();tutEvent('place');
  }else{const it=itemAt(fi,c,r);if(!it)return;if(R.custs.some(cu=>cu.seat===it)){toast('Someone is sitting there!','bad');return}
    for(const cu of R.custs)if(cu.table&&cu.floor===fi&&cu.table.c===it.c&&cu.table.r===it.r){cu.table=null;cu.restCup=null}
    f.items=f.items.filter(x=>x!==it);f.dirt=f.dirt.filter(d=>!(d.kind==='trash'&&d.c===c&&d.r===r&&FURN[it.id].role==='seat'));G.inv[it.id]=(G.inv[it.id]||0)+1;rebuildOcc();repathAll();sfx('pop')}
  R.amb=computeAmb();R.dirty=true;
}

  if(r&&G.open)return `<div class="rushline on"><b>${r.name}!</b> Busy until ${clockStr(r.to)}.${q?` ${q} waiting in line.`:''}</div>`;
  if(n)return `<div class="rushline">Next rush: <b>${n.name}</b> at ${clockStr(n.from)}.${q?` ${q} waiting in line.`:''}</div>`;

function unlockedNow(){return new Set(RECIPES.filter(recipeOn).map(r=>r.id))}
function buy(key,quiet){
  const[k,id]=key.split(':');const before=unlockedNow();const f=G.floors[R.view];const m0=G.money;
  const pay=p=>{if(G.money<p){toast('Not enough money.','bad');sfx('bad');return false}G.money-=p;return true};
  if(k==='bag'){const b=BEAN_BAGS.find(b=>b.id===id);if(!pay(b.price))return false;G.beans+=b.cups;if(!quiet)toast(`+${b.cups} cups of beans`,'good')}

function parseMarkup(s){const segs=[];let cls='',last=0,m;const re=/\{(y|r|p|g|\/)\}/g;while((m=re.exec(s))){if(m.index>last)segs.push({t:s.slice(last,m.index),c:cls});cls=m[1]==='/'?'':m[1];last=re.lastIndex}if(last<s.length)segs.push({t:s.slice(last),c:cls});return segs}
function segsHTML(segs,n){let out='',k=0;for(const sg of segs){const shown=Math.max(0,Math.min(sg.t.length,n-k)),a=sg.t.slice(0,shown),b=sg.t.slice(shown);k+=sg.t.length;
  if(a)out+=sg.c?`<span class="${sg.c}">${esc(a)}</span>`:esc(a);if(b)out+=`<span class="${sg.c} ghost">${esc(b)}</span>`}return out}

function typeInto(el,text,o={}){
  const segs=parseMarkup(text),flat=segs.map(s=>s.t).join(''),L=flat.length;
  const ctl={n:0,done:false,h:0,stop(){clearTimeout(ctl.h)},skip(){ctl.n=L;draw();fin()}};
  const draw=()=>{el.innerHTML=segsHTML(segs,ctl.n)};
  const fin=()=>{if(ctl.done)return;ctl.done=true;clearTimeout(ctl.h);draw();o.onDone&&o.onDone()};
  const step=()=>{if(ctl.done)return;ctl.n++;const ch=flat[ctl.n-1];draw();if(ch&&ch.trim()&&ctl.n%2===0)blip(o.voice);o.onChar&&o.onChar(ctl.n);
    if(ctl.n>=L){fin();return}ctl.h=setTimeout(step,'.!?'.includes(ch)&&flat[ctl.n]===' '?260:ch===','?140:(o.speed||30))};
  draw();ctl.h=setTimeout(step,80);return ctl;
}

  const items=[];for(const m of miss){if(m.t==='eq'){const d=EQ[m.id];if(d.star>G.maxStar)return null;items.push({key:'eq:'+m.id,name:d.name,icon:'eq:'+m.id,price:d.price})}else{const d=ING[m.id];if(d.star>G.maxStar)return null;items.push({key:'ing:'+m.id,name:d.name,icon:'ing:'+m.id,price:d.price})}}
  return{r,items,total:items.reduce((a,b)=>a+b.price,0)};
}

    for(const[id,d]of Object.entries(ING))if(!d.hidden)out.push({key:'ing:'+id,name:d.name,desc:d.desc+'. Never runs out.',icon:'ing:'+id,price:d.price,star:d.star,owned:!!G.ing[id],unl:unlocksBy('ing',id)});
    if(G.meat>0)out.push({key:'sellmeat',act:'sellmeat',name:'Suspicious Meat',desc:`The butcher out back pays ${fmt(MEAT_PRICE)} each. No questions asked.`,icon:'ing:meat',price:MEAT_PRICE,sell:true,count:G.meat});
  }else if(cat==='equipment'){for(const[id,d]of Object.entries(EQ))out.push({key:'eq:'+id,name:d.name,desc:d.desc,icon:'eq:'+id,price:d.price,star:d.star,owned:!!G.eq[id],unl:unlocksBy('eq',id)})}

  else if(cat==='style'){

    for(const[id,d]of Object.entries(FLOORS))out.push({key:'floor:'+id,group:'Floors',name:d.name,desc:d.dirty?'Squeaky and soggy.':`Style +${d.beauty}`,icon:'floor:'+id,price:G.styles.floor[id]?0:d.price,star:d.star,use:!!G.styles.floor[id],inuse:f.floor===id});
  }else if(cat==='build'){
    const nx=EXPANSIONS[G.exp+1];

    else out.push({key:'build',name:'Fully expanded',desc:'The ground floor is as big as it gets.',icon:'build:x',price:0,owned:true});
    out.push({key:'build2f',act:'build2f',name:'Second floor',desc:'A whole new 12×8 floor with stairs. Opens 1 more barista spot and 1 more janitor spot.',icon:'build:x',price:SECOND_FLOOR.price,star:SECOND_FLOOR.star,owned:G.has2F});
  }else if(cat==='security'){for(const[id,d]of Object.entries(ARMS))out.push({key:'arm:'+id,name:d.name,desc:d.desc,icon:'arm:'+id,price:d.price,star:d.star,repeat:true,count:G.arms[id]||0,stats:`${d.melee?'Melee':'Range '+d.range}`+` · ${Math.round(d.dmg/d.cd)} dmg/s`})}
  return out;
}
function canBuy(it){return !it.owned&&!it.inuse&&(it.star||0)<=G.maxStar&&(it.sell||it.price<=G.money)}
function shopCard(it,cat){
  const locked=(it.star||0)>G.maxStar,tint=CAT_TINT[cat]||'#fff0c9';
  const isNew=!locked&&it.star>0&&it.star===G.maxStar&&!it.owned&&!it.count&&!it.use;
  let sticker='';if(it.owned||it.inuse)sticker=`<span class="sticker ok">${it.inuse?'In use':'Owned'}</span>`;else if(it.use)sticker='<span class="sticker ok">Free</span>';else if(it.sell)sticker=`<span class="sticker sell">+${fmt(it.price)}</span>`;else sticker=`<span class="sticker">${it.price===0?'Free':fmt(it.price)}</span>`;
  let unl='';if(it.unl&&it.unl.length&&!it.owned){const now=it.unl.filter(u=>u.now);unl=now.length?`<span class="unl"><img src="${iconURL('rec:'+now[0].r.id)}" alt="">Unlocks ${esc(now[0].r.name)}${now.length>1?` +${now.length-1}`:''}</span>`:`<span class="unl dim">Used in ${it.unl.length} recipe${it.unl.length>1?'s':''}</span>`}
  if(it.note)unl+=`<span class="unl ${it.warn?'warn':'dim'}">${esc(it.note)}</span>`;
  if(it.stats)unl+=`<span class="unl dim">${esc(it.stats)}</span>`;
  let btn;const act=it.act||'buy';
  if(it.owned)btn='<button class="btn alt wide" disabled>Owned</button>';
  else if(it.inuse)btn='<button class="btn alt wide" disabled>In use</button>';
  else if(locked)btn=`<button class="btn wide" disabled>Reach ${'★'.repeat(it.star)}</button>`;
  else if(it.sell)btn=`<button class="btn gold wide" data-act="sellmeat">Sell 1</button>`;
  else if(it.use)btn=`<button class="btn wide" data-act="buy" data-buy="${it.key}">Use this</button>`;
  else if(it.price>G.money)btn=`<button class="btn wide" disabled>Need ${fmt(it.price-G.money)} more</button>`;
  else btn=`<button class="btn wide" data-act="${act}" ${act==='buy'?`data-buy="${it.key}"`:''}>${it.repeat&&it.count?'Buy another':act==='buy'?'Buy':'Build'}</button>`;
  return `<div class="scard ${locked?'locked':''} ${it.owned||it.inuse?'have':''}" data-key="${it.key}" style="--tint:${tint}">
    <div class="sdisp"><img src="${iconURL(it.icon)}" alt="">${sticker}${it.count?`<span class="scount">×${it.count}</span>`:''}${isNew?'<span class="snew">NEW</span>':''}${locked?`<span class="slock"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>${'★'.repeat(it.star)}</span>`:''}</div>
    <div class="sinfo"><div class="nm">${esc(it.name)}</div><div class="ds">${esc(it.desc||'')}</div>${unl?`<div class="unls">${unl}</div>`:''}</div>
    <div class="sfoot">${btn}</div></div>`;
}

function renderShop(resetScroll){

  $('#shopMoney').textContent=fmt(G.money);
  $('#shopNav').innerHTML=SHOP_CATS.map(([k,l,ic,tint])=>{const n=k==='featured'?0:shopItems(k).filter(canBuy).filter(i=>!i.use&&!i.sell).length;return `<button data-act="shopcat" data-k="${k}" class="${cat===k&&!q?'on':''}" style="--tint:${tint}"><img src="${iconURL(ic)}" alt=""><span>${l}</span>${n?`<i>${n}</i>`:''}</button>`}).join('');

    else if(cat==='furniture'){h+=`<h3 class="shead">${label} <small>${items.length} items</small></h3>`;for(const[role,rl,note]of[['seat','Seats','Customers sit here after ordering'],['table','Tables','Seats next to a table count more'],['decor','Plants & decor','Raises your decor score'],['rug','Rugs','Customers can walk over these']]){const gi=items.filter(([i])=>FURN[i.key.split(':')[1]].role===role);if(gi.length)h+=`<h3 class="shead" style="font-size:16px;margin-top:14px">${rl} <small>${note}</small></h3><div class="sgrid">${gi.map(([i,c])=>shopCard(i,c)).join('')}</div>`}}
    else h+=`<h3 class="shead">${label} <small>${items.length} items</small></h3><div class="sgrid">${items.map(([i,c])=>shopCard(i,c)).join('')}</div>`;
    if(!items.length)h+='<div class="empty">Nothing you can buy here right now.</div>';
  }
  const sc=$('#shopScroll');const keep=sc.scrollTop;main.innerHTML=h;sc.scrollTop=resetScroll?0:keep;
}

function debugAct(a){
  if(!G)return;
  switch(a){
    case 'dbgMoney':G.money+=1000;sfx('bigcoin');toast('+$1,000','gold');floatText(LW/2,WALL*T+40,'+$1,000','#3c977a');R.dirty=true;break;
    case 'dbgRob':{if(R.rob){toast('A robbery is already happening!','bad');return}const w=$('#dbgWeap').value||null;startRobbery({weapon:w});break}
    case 'dbgCust':if(!G.dayActive||!G.open){toast('Open the café first.','bad');return}if(R.rob){toast('Not during a robbery!','bad');return}if(R.spots.every(Boolean)){toast('The counter is full.','bad');return}spawnCustomer(true);break;
    case 'dbgClean':for(const f of G.floors)f.dirt=[];R.amb=computeAmb();sfx('good');toast('Sparkling clean!','good');R.dirty=true;break;
    case 'dbgStar':if(G.maxStar>=5){toast('Already at 5 stars.');return}G.rating=Math.min(5,Math.floor(G.rating+1e-6)+1);checkStars();R.dirty=true;break;
    case 'dbgRush':{if(!G.dayActive){toast('Open the café first.','bad');return}const n=nextRush();if(!n){toast('No more rushes today.','bad');return}G.time=n.from;toast(`Skipped to ${n.name.toLowerCase()}.`);break}

  if(tutOn){const el=resolveTarget(TUT[G.tut]);if(el){const b=el.getBoundingClientRect();if(b.width&&b.height)r=b}}
  if(r){const pad=6;ring.hidden=false;ring.style.left=(r.left-pad)+'px';ring.style.top=(r.top-pad)+'px';ring.style.width=(r.width+pad*2)+'px';ring.style.height=(r.height+pad*2)+'px'}else ring.hidden=true;
  if(!box.hidden){const vh=innerHeight;let top=false;if(SAY.cur&&!SAY.cur.tut)top=true;else if(r)top=r.height>vh*.45||r.top+r.height/2>vh*.5;box.classList.toggle('top',top)}
}

/* ============ title screen ============ */
function showTitle(mode){
  $('#title').hidden=false;$('#debug').hidden=true;sayReset();hideCoach();if(R.shopOpen)closeShop();$('#mg').hidden=true;R.mg=null;const tc=$('#tcard');const sv=loadLocalRaw();
  const logo=`<div class="logo">mapa<span>mapa</span></div><div class="tsub" style="margin:0;font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px">a cozy café tycoon</div>`;
  if(mode==='new')tc.innerHTML=`${logo}<p class="tsub">Name your café. You can rename it any time from the Café tab.</p><div class="stack"><input type="text" id="tName" maxlength="28" placeholder="Mapamapa" aria-label="Café name"><label style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px"><input type="checkbox" id="tTut" checked> Show me the tutorial</label><button class="btn" data-act="tStart">Get the keys</button><button class="btn alt" data-act="tBack">Back</button></div>`;
  else if(mode==='load')tc.innerHTML=`${logo}<p class="tsub">Paste a save code or open a save file.</p><div class="stack"><textarea id="tCode" rows="4" placeholder="LBC1.…" aria-label="Save code"></textarea><button class="btn" data-act="loadCode">Load code</button><button class="btn alt" data-act="loadFile">Open a save file</button><button class="btn alt" data-act="tBack">Back</button></div>`;
  else tc.innerHTML=`${logo}<p class="tsub">Turn a rusty, smelly little room into a five-star café.</p><div class="stack">${sv&&sv.floors?`<button class="btn gold" data-act="tContinue">Continue: ${esc(sv.name)} · Day ${Math.max(1,sv.day)} · ${(+sv.rating||0).toFixed(1)}★</button>`:''}<button class="btn" data-act="tNew">New café</button><button class="btn alt" data-act="tLoad">Load a save</button></div>`;
  if(mode==='new')setTimeout(()=>$('#tName')&&$('#tName').focus(),50);
}
const tParts=[];
function drawTitle(dt){const cv=$('#titleCv');if($('#title').hidden)return;const w=cv.clientWidth,h=cv.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#2f2227';c.fillRect(0,0,w,h);
  c.fillStyle='rgba(255,248,239,.022)';for(let y=0,r=0;y<h;y+=40,r++)for(let x=(r%2)*40;x<w;x+=80)c.fillRect(x,y,40,40);
  if(tParts.length<26&&Math.random()<.2)tParts.push({x:Math.random()*w,y:h+60,s:rnd(.25,.45),v:rnd(14,30),id:pick(RECIPES).id,r:rnd(-.3,.3),vr:rnd(-.2,.2)});
  for(const p of tParts){p.y-=p.v*dt;p.r+=p.vr*dt;c.save();c.globalAlpha=.55;c.translate(p.x,p.y);c.rotate(p.r);c.drawImage(recIconCanvas(p.id),-100*p.s,-110*p.s,200*p.s,220*p.s);c.restore()}
  for(let i=tParts.length-1;i>=0;i--)if(tParts[i].y<-120)tParts.splice(i,1);
}

/* ============ boot ============ */
function startGame(isNew){
  $('#title').hidden=true;resetRuntime();G.floors.forEach((_,i)=>repairLayout(i));R.tab='orders';R.amb=computeAmb();R.dirty=true;
  requestAnimationFrame(()=>{resize();renderPanel();if(G.tut>=0){const s=TUT[G.tut];if(s&&s.enter)s.enter();renderPanel();showCoach()}else hideCoach()});
  if(isNew)toast('Welcome to '+G.name+'!','gold');saveLocal();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset,b)});
$('#btnOpen').addEventListener('click',()=>{initAudio();if(!G)return;
  if(!G.dayActive){if(G.tut>=0&&G.tut<TUT_OPEN){toast('Finish the tutorial steps first!');return}if(!RECIPES.some(orderable)){toast(G.beans<=0&&RECIPES.some(recipeOn)?'You need coffee beans before you can open.':'Nothing to sell yet! Buy beans, a grinder and a kettle first.','bad');sfx('bad');return}if(R.edit)toggleEdit(false);startDay();tutEvent('open')}
  else if(G.open){G.open=false;toast('Closing up after these customers.')}
  else if(G.time<DAY_END-20){G.open=true;R.spawnT=2;toast('Back open!','good')}
  R.dirty=true});
$('#btnEdit').addEventListener('click',()=>{initAudio();if(!G)return;if(R.mg||R.rob)return;toggleEdit()});
$('#btnShop').addEventListener('click',()=>{initAudio();if(!G)return;R.shopOpen?closeShop():openShop()});
$('#btnPause').addEventListener('click',()=>{R.paused=!R.paused;updateHud()});
const SPEEDS=[.5,1,1.5,2];
function cycleSpeed(dir=1){if(!G)return;const i=SPEEDS.indexOf(G.speed||1);G.speed=SPEEDS[(i+dir+SPEEDS.length)%SPEEDS.length];sfx('tick');toast(`Game speed: ${G.speed}x`);updateHud()}
$('#btnSpeed').addEventListener('click',()=>{initAudio();cycleSpeed(1)});
$('#btnSpeed').addEventListener('contextmenu',e=>{e.preventDefault();cycleSpeed(-1)});
$('#btnMusic').addEventListener('click',()=>{initAudio();setMusic(!MUS.on);updateHud()});
document.addEventListener('pointerdown',()=>initAudio());
$('#btnSound').addEventListener('click',()=>{initAudio();G.sound=!G.sound;updateHud();sfx('pop')});
$('#sceneWrap').addEventListener('pointerdown',e=>{if(e.target===glc)sceneClick(e)});
$('#sceneWrap').addEventListener('pointermove',e=>{if(G&&e.target===glc)R.hover=toLogical(e)});
$('#sceneWrap').addEventListener('pointerleave',()=>{R.hover=null});
document.addEventListener('keydown',e=>{
  if(R.mg&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();if(e.repeat)return;const s=R.mg.step;
    if(e.code==='Enter'){if(s.t==='result')finishMinigame();else mgDone();return}
    if(s.t==='hold'||(s.t==='meter'&&R.mg.st&&R.mg.st.elec)){if(!R.mg.lock)R.mg.st.holding=true}else if(s.t==='result')finishMinigame();else mgMain();return}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(!typing&&e.code==='KeyF'&&G&&$('#title').hidden&&!R.mg){cycleSpeed(e.shiftKey?-1:1);return}
  if(!typing&&!R.mg&&SAY.cur&&(e.code==='KeyZ'||e.code==='Enter'||(e.code==='Space'&&e.target===document.body))){e.preventDefault();sayAdvance();return}
  if(e.code==='Escape'){if(R.mg)cancelMinigame();else if(R.shopOpen)closeShop();else if(!$('#dlg').hidden)closeDialog();else if(R.edit)toggleEdit(false);return}
  if(!typing&&e.code==='KeyB'&&G&&$('#title').hidden&&!R.mg){R.shopOpen?closeShop():openShop()}
});
document.addEventListener('keyup',e=>{if(R.mg&&e.code==='Space'&&R.mg.st&&R.mg.st.holding){R.mg.st.holding=false;if(R.mg.step.t==='hold')holdRelease()}});
window.addEventListener('resize',()=>{resize();positionCoach()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveLocal();if(actx&&actx.state==='running')actx.suspend()}else if(actx&&actx.state==='suspended')actx.resume()});
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  try{if(G&&$('#title').hidden){update(dt);renderScene();present()}else drawTitle(dt)}catch(err){console.error(err)}
  requestAnimationFrame(frame)}
setInterval(()=>{try{liveTick();positionCoach()}catch(e){console.error(e)}},250);
initGL();
function boot(data){if(data&&data.G&&applySave(data.G)){startGame(false)}else showTitle()}
try{window.claude?.hot?.snapshot?.(()=>({G}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
requestAnimationFrame(frame);
</script>
</body></html>
